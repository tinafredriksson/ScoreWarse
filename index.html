<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Score Wars</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
<h1>Score Wars - Let's play</h1>

<div id="stats">
  <p>Score: <span id="scoreDisplay">0</span></p>
  <p>Time left: <span id="timerDisplay">60</span></p>
</div>

<div id="gameArea">
  <div id="clickBox" role="button" tabindex="0">Press me!</div>
  <div class="fakeBox"></div>
  <div class="fakeBox"></div>
  <div class="fakeBox"></div>
</div>

<div id="gameOverPanel">
  <p id="finalScore"></p>

  <label id="label1" for="name">Name (4 to 10 characters):</label>

  <input
    type="text"
    id="name"
    name="name"
    required
    minlength="4"
    maxlength="10"
    size="12" />

  <button id="button2">Submit score</button>

  <p id="message"></p>

  <button id="restartButton">Play again</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
